<!DOCTYPE html>
<html lang="el"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Radio - Live Web Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: radial-gradient(circle at center, #e11d48 0%, #be123c 50%, #881337 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .tagline {
            font-size: 0.95rem;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        .logo-container {
            margin-bottom: 2rem;
        }
        .logo-main {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
            letter-spacing: -2px;
        }
        .logo-sub {
            font-size: 1.8rem;
            font-weight: 700;
            font-style: italic;
            margin-top: 0.5rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .player-container {
            margin: 2rem 0;
            width: 100%;
            max-width: 320px;
        }
        audio {
            width: 100%;
            height: 45px;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .now-playing-label {
            font-size: 1.05rem;
            font-weight: 600;
            color: #facc15;
            margin-top: 1.5rem;
            margin-bottom: 0.4rem;
        }
        .track-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 25px rgba(147, 197, 253, 0.7);
            margin-bottom: 0.3rem;
        }
        .track-artist {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="tagline">THE HIT WEB-RADIO BRAND</div>

    <div class="logo-container">
        <!-- Μπορείς να αντικαταστήσεις τα παρακάτω κείμενα με το λογότυπό σου <img> -->
        <div class="logo-main">STAR RADIO</div>
        <div class="logo-sub">80's & 90's Back To Back</div>
    </div>

    <div class="player-container">
        <audio controls preload="none">
            <source src="https://stream.zeno.fm/wqreogixiotuv" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <div class="now-playing-label">Now Playing:</div>
    <div class="track-title" id="song-title">Loading...</div>
    <div class="track-artist" id="song-artist">STAR RADIO</div>

    <script>
        // Αντλεί τα metadata (τίτλο/καλλιτέχνη) από το Zeno API
        async function fetchNowPlaying() {
            try {
                const response = await fetch('https://api.zeno.fm/mounts/metadata/subscribe/wqreogixiotuv');
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    
                    if (chunk.includes('streamTitle')) {
                        const match = chunk.match(/"streamTitle":"([^"]+)"/);
                        if (match && match[1]) {
                            const parts = match[1].split(' - ');
                            if (parts.length > 1) {
                                document.getElementById('song-artist').innerText = parts[0];
                                document.getElementById('song-title').innerText = parts.slice(1).join(' - ');
                            } else {
                                document.getElementById('song-title').innerText = match[1];
                                document.getElementById('song-artist').innerText = 'STAR RADIO';
                            }
                        }
                    }
                }
            } catch (err) {
                // Fallback αν το SSE stream δεν απαντήσει άμεσα
                document.getElementById('song-title').innerText = 'Star Radio Live';
            }
        }

        fetchNowPlaying();
    </script>
</body>
</html>
