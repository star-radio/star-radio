<!DOCTYPE html>
<html lang="el"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Radio - Live Web Player</title>
    <!-- Εισαγωγή γραμματοσειράς Audiowide -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Audiowide', cursive, sans-serif;
            background: radial-gradient(circle at center, #930628 0%, #4a0013 65%, #1f0007 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }

        .tagline {
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            margin-bottom: 1.2rem;
            color: #e2a8be;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        .logo-container {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* 3D Αστέρια */
        .star {
            color: #ffffff;
            font-size: 2.5rem;
            text-shadow: 
                0 1px 0 #cccccc,
                0 2px 0 #c0c0c0,
                0 3px 0 #a0a0a0,
                0 4px 0 #808080,
                0 5px 0 #606060,
                0 8px 12px rgba(0, 0, 0, 0.8);
        }

        /* 3D Λευκό Λογότυπο STAR RADIO */
        .logo-main {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 
                0 1px 0 #d9d9d9,
                0 2px 0 #cccccc,
                0 3px 0 #bfbfbf,
                0 4px 0 #b3b3b3,
                0 5px 0 #a6a6a6,
                0 6px 0 #999999,
                0 7px 0 #8c8c8c,
                0 8px 0 #808080,
                0 12px 18px rgba(0, 0, 0, 0.9),
                0 20px 30px rgba(0, 0, 0, 0.6);
        }

        .logo-sub {
            font-size: 1.3rem;
            margin-top: 0.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
        }

        /* Container Γραφικών & Player */
        .player-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 1.8rem 0 1.2rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SVG Γραφικά: Κασέτα & CDs */
        .media-graphics-img {
            width: 85%;
            height: auto;
            margin-bottom: -18px;
            z-index: 1;
            filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.8));
        }

        /* Custom Μεταλλικός Player */
        .custom-player-bar {
            width: 100%;
            height: 46px;
            background: linear-gradient(180deg, #7a7a7a 0%, #333333 50%, #1a1a1a 100%);
            border-radius: 23px;
            border: 2px solid #b0b0b0;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            z-index: 2;
        }

        .play-btn {
            background: none;
            border: none;
            color: #d1d1d1;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .play-btn:hover { color: #ffffff; }

        .time-display {
            font-family: 'Audiowide', cursive, sans-serif;
            font-size: 0.85rem;
            color: #b0b0b0;
            min-width: 45px;
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 7px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #be123c);
            box-shadow: 0 0 8px #ff007f;
        }

        .vol-icon {
            color: #d1d1d1;
            font-size: 1.0rem;
        }

        audio.hidden-player { display: none; }

        /* Ετικέτα Now Playing - Φωτεινό Κίτρινο */
        .now-playing-label {
            font-size: 1.3rem;
            color: #ffea00;
            text-shadow: 0 0 12px rgba(255, 234, 0, 0.9), 0 0 22px rgba(255, 200, 0, 0.6);
            margin-top: 1rem;
            margin-bottom: 0.4rem;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .track-title {
            font-size: 2rem;
            color: #fff9e6;
            text-shadow: 0 0 12px rgba(255, 235, 175, 0.8), 0 0 25px rgba(255, 200, 100, 0.5);
            margin-bottom: 0.4rem;
        }

        /* Release Date - Λευκό */
        .release-date {
            font-size: 1.05rem;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 0.4rem;
            opacity: 0.95;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Καλλιτέχνης - Εντονότατο Κίτρινο */
        .track-artist {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffea00;
            text-shadow: 0 0 12px rgba(255, 234, 0, 0.8), 0 2px 4px rgba(0,0,0,0.9);
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        /* Ενότητα Recently Played */
        .history-container {
            width: 100%;
            max-width: 420px;
            margin-top: 1rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .history-title {
            font-size: 0.95rem;
            color: #ffea00;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            text-shadow: 0 0 8px rgba(255, 234, 0, 0.5);
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            font-size: 0.85rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 1px;
        }

        .history-item span {
            color: #ffea00;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .logo-main { font-size: 2.8rem; }
            .star { font-size: 1.8rem; }
            .logo-sub { font-size: 1rem; }
            .track-title { font-size: 1.5rem; }
            .now-playing-label { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="tagline">THE HIT WEB-RADIO BRAND</div>

    <div class="logo-container">
        <div class="logo-main-wrapper">
            <span class="star">★</span>
            <div class="logo-main">STAR RADIO</div>
            <span class="star">★</span>
        </div>
        <div class="logo-sub">80's & 90's Back To Back</div>
    </div>

    <div class="player-wrapper">
        <!-- SVG Γραφικά: Κασέτα + CDs -->
        <svg class="media-graphics-img" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="gold" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fffbea"/><stop offset="30%" stop-color="#f59e0b"/>
                    <stop offset="70%" stop-color="#b45309"/><stop offset="100%" stop-color="#78350f"/>
                </radialGradient>
                <radialGradient id="pink" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fdf2f8"/><stop offset="35%" stop-color="#ec4899"/>
                    <stop offset="70%" stop-color="#831843"/><stop offset="100%" stop-color="#4c0519"/>
                </radialGradient>
            </defs>
            <g transform="translate(10, 12) rotate(-8)">
                <rect width="80" height="50" rx="5" fill="#881337" stroke="#ffb3c1" stroke-width="1.5"/>
                <rect x="8" y="7" width="64" height="22" rx="3" fill="#200007" stroke="#ec4899" stroke-width="1"/>
                <circle cx="24" cy="18" r="6" fill="#fff"/><circle cx="56" cy="18" r="6" fill="#fff"/>
                <polygon points="20,40 60,40 55,46 25,46" fill="#4c0519"/>
            </g>
            <g transform="translate(100, 10)"><circle cx="26" cy="26" r="25" fill="url(#pink)" stroke="#ffb3c1" stroke-width="1"/><circle cx="26" cy="26" r="9" fill="#ffe4e6" opacity="0.6"/><circle cx="26" cy="26" r="4" fill="#200007"/></g>
            <g transform="translate(140, 2)"><circle cx="28" cy="28" r="27" fill="url(#gold)" stroke="#fef08a" stroke-width="1.2"/><circle cx="28" cy="28" r="10" fill="#fef9c3" opacity="0.8"/><circle cx="28" cy="28" r="4.5" fill="#200007"/></g>
            <g transform="translate(185, 8)"><circle cx="26" cy="26" r="25" fill="url(#pink)" stroke="#ffb3c1" stroke-width="1"/><circle cx="26" cy="26" r="9" fill="#ffe4e6" opacity="0.6"/><circle cx="26" cy="26" r="4" fill="#200007"/></g>
            <g transform="translate(225, 14)"><circle cx="24" cy="24" r="23" fill="url(#pink)" stroke="#ffb3c1" stroke-width="1"/><circle cx="24" cy="24" r="8" fill="#ffe4e6" opacity="0.6"/><circle cx="24" cy="24" r="3.5" fill="#200007"/></g>
        </svg>

        <!-- Custom Μεταλλική Μπάρα Player -->
        <div class="custom-player-bar">
            <button class="play-btn" id="playBtn">▶</button>
            <span class="time-display" id="timeDisp">00:00</span>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="vol-icon">🔊</span>
        </div>

        <audio id="audio" class="hidden-player" preload="none">
            <source src="https://stream.zeno.fm/wqreogixiotuv" type="audio/mpeg">
        </audio>
    </div>

    <div class="now-playing-label">Now Playing:</div>
    <div class="track-title" id="song-title">Loading...</div>
    <div class="release-date" id="song-release">Release Date: ----</div>
    <div class="track-artist" id="song-artist">STAR RADIO</div>

    <!-- Λίστα Προηγούμενων Τραγουδιών -->
    <div class="history-container" id="historyContainer">
        <div class="history-title">Recently Played</div>
        <ul class="history-list" id="historyList"></ul>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const timeDisp = document.getElementById('timeDisp');
        const progressFill = document.getElementById('progressFill');

        const STREAM_KEY = 'wqreogixiotuv';

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '❚❚';
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        });

        audio.addEventListener('timeupdate', () => {
            const m = Math.floor(audio.currentTime / 60);
            const s = Math.floor(audio.currentTime % 60);
            timeDisp.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            progressFill.style.width = ((audio.currentTime % 60) * (100 / 60)) + '%';
        });

        // Ανάκτηση Ιστορικού με CORS Proxy
        async function fetchSongHistory() {
            try {
                const targetUrl = `https://api.zeno.fm/mounts/metadata/history/${STREAM_KEY}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                
                const res = await fetch(proxyUrl);
                const data = await res.json();
                
                if (data && data.length > 1) {
                    const pastSongs = data.slice(1, 4);
                    const list = document.getElementById('historyList');
                    
                    list.innerHTML = pastSongs.map(item => {
                        const clean = item.streamTitle.replace(/\s*\(\d{4}\)/, '');
                        const parts = clean.split(' - ');
                        const artist = parts.length > 1 ? parts[0] : 'STAR RADIO';
                        const title = parts.length > 1 ? parts.slice(1).join(' - ') : clean;
                        return `<li class="history-item"><span>${artist}</span> - ${title}</li>`;
                    }).join('');
                }
            } catch (err) {
                console.error("Σφάλμα ανάκτησης ιστορικού:", err);
            }
        }

        // Ζωντανή ανάκτηση τρέχοντος τραγουδιού
        async function fetchNowPlaying() {
            try {
                const response = await fetch(`https://api.zeno.fm/mounts/metadata/subscribe/${STREAM_KEY}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    
                    if (chunk.includes('streamTitle')) {
                        const match = chunk.match(/"streamTitle":"([^"]+)"/);
                        if (match && match[1]) {
                            const rawTitle = match[1];
                            
                            const yearMatch = rawTitle.match(/\((\d{4})\)/);
                            if (yearMatch && yearMatch[1]) {
                                document.getElementById('song-release').innerText = 'Release Date: ' + yearMatch[1];
                            } else {
                                document.getElementById('song-release').innerText = 'Release Date: ----';
                            }

                            const cleanTitle = rawTitle.replace(/\s*\(\d{4}\)/, '');
                            const parts = cleanTitle.split(' - ');
                            
                            if (parts.length > 1) {
                                document.getElementById('song-artist').innerText = parts[0];
                                document.getElementById('song-title').innerText = parts.slice(1).join(' - ');
                            } else {
                                document.getElementById('song-title').innerText = cleanTitle;
                                document.getElementById('song-artist').innerText = 'STAR RADIO';
                            }

                            fetchSongHistory();
                        }
                    }
                }
            } catch (err) {
                document.getElementById('song-title').innerText = 'Star Radio Live';
            }
        }

        fetchSongHistory();
        fetchNowPlaying();
    </script>
</body>
</html>
